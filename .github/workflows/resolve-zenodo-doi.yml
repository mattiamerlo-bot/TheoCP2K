name: Resolve Zenodo DOI

'on':
  push:
    paths:
      - '.github/workflows/resolve-zenodo-doi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-doi:
    name: Resolve latest Zenodo DOI
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve Zenodo latest DOI redirect
        shell: bash
        run: |
          set -euo pipefail
          final_url="$(curl --fail --silent --show-error --location --output /dev/null --write-out '%{url_effective}' 'https://zenodo.org/badge/latestdoi/1362776359')"
          echo "Resolved URL: ${final_url}"
          doi="${final_url#https://doi.org/}"
          if [[ "${doi}" == "${final_url}" || ! "${doi}" =~ ^10\.5281/zenodo\.[0-9]+$ ]]; then
            echo "Could not resolve a valid Zenodo DOI from ${final_url}" >&2
            exit 1
          fi
          echo "Zenodo DOI: ${doi}"
          echo "::notice title=Zenodo DOI::${doi}"
