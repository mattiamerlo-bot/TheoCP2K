name: Linux AppImage

'on':
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-appimage:
    name: Build and test x86_64 AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils python3-tk python3-venv xauth xvfb

      - name: Create isolated build environment
        run: |
          python3 -m venv .venv-appimage
          .venv-appimage/bin/python -m pip install --upgrade pip
          .venv-appimage/bin/python -m pip install -r packaging/appimage/requirements.txt

      - name: Run unit tests
        env:
          MPLBACKEND: Agg
        run: .venv-appimage/bin/python -m unittest discover -s tests -v

      - name: Validate desktop integration files
        run: |
          desktop-file-validate packaging/appimage/TheoCP2K.desktop
          bash -n packaging/appimage/AppRun
          bash -n packaging/appimage/theocp2k-wrapper
          bash -n packaging/appimage/build-appimage.sh

      - name: Build AppImage
        env:
          PYTHON_BIN: .venv-appimage/bin/python
        run: packaging/appimage/build-appimage.sh

      - name: Smoke-test bundled GUI under Xvfb
        run: xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 dist/TheoCP2K-x86_64.AppImage --smoke-test

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: TheoCP2K-Linux-x86_64
          path: |
            dist/TheoCP2K-x86_64.AppImage
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-appimage
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v8
        with:
          name: TheoCP2K-Linux-x86_64
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/TheoCP2K-x86_64.AppImage
          release/SHA256SUMS.txt
          --verify-tag
          --generate-notes
          --title "TheoCP2K $GITHUB_REF_NAME"
