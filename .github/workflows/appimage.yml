name: Linux AppImage

'on':
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-appimage:
    name: Build and test x86_64 AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils python3-tk python3-venv xauth xvfb

      - name: Create isolated build environment
        run: |
          python3 -m venv .venv-appimage
          .venv-appimage/bin/python -m pip install --upgrade pip
          .venv-appimage/bin/python -m pip install -r packaging/appimage/requirements.txt

      - name: Run unit tests
        env:
          MPLBACKEND: Agg
        run: .venv-appimage/bin/python -m unittest discover -s tests -v

      - name: Validate desktop integration files
        run: |
          desktop-file-validate packaging/appimage/TheoCP2K.desktop
          desktop-file-validate packaging/linux/TheoCP2K.desktop
          bash -n packaging/appimage/AppRun
          bash -n packaging/appimage/theocp2k-wrapper
          bash -n packaging/appimage/build-appimage.sh
          bash -n packaging/linux/install-desktop.sh

      - name: Build AppImage
        env:
          PYTHON_BIN: .venv-appimage/bin/python
        run: packaging/appimage/build-appimage.sh

      - name: Smoke-test bundled GUI under Xvfb
        run: xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 dist/TheoCP2K-x86_64.AppImage --smoke-test

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: TheoCP2K-Linux-x86_64
          path: |
            dist/TheoCP2K-x86_64.AppImage
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish versioned release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build-appimage
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Check out version metadata
        uses: actions/checkout@v7

      - name: Resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            verify_tag=true
          else
            release_tag="v$(tr -d '[:space:]' < VERSION)"
            verify_tag=false
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag from VERSION: $release_tag" >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "verify_tag=$verify_tag" >> "$GITHUB_OUTPUT"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $release_tag already exists; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download verified build artifact
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: TheoCP2K-Linux-x86_64
          path: release

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERIFY_TAG: ${{ steps.release.outputs.verify_tag }}
        run: |
          tag_options=()
          if [[ "$VERIFY_TAG" == true ]]; then
            tag_options+=(--verify-tag)
          else
            tag_options+=(--target "$GITHUB_SHA")
          fi
          gh release create "$RELEASE_TAG" \
            release/TheoCP2K-x86_64.AppImage \
            release/SHA256SUMS.txt \
            "${tag_options[@]}" \
            --generate-notes \
            --title "TheoCP2K $RELEASE_TAG"
